name: CD — Production Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20'
  DEPLOY_ENV: production
  DEPLOY_PATH: /var/www/his-backend

jobs:
  # ─── Pre-deployment checks ───────────────────────────────────────────────
  pre-deploy:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version
        id: tag
        run: |
          VERSION=${VERSION:-${{ github.ref_name }}}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate tag format
        run: |
          if ! echo '${{ steps.tag.outputs.version }}' | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid tag format. Expected: v1.0.0"
            exit 1
          fi
          echo "✅ Release version: ${{ steps.tag.outputs.version }}"

  # ─── Security scan ──────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: pre-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-deploy.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: OWASP dependency check
        run: npx RetireJS --outputformat text --outputpath retire-report.txt
        continue-on-error: true

  # ─── Deploy to Production ───────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy, security-scan]
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-deploy.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.CACHE_DIR }}

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run full test suite
        run: npm test
        env:
          NODE_ENV: production

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            git fetch --tags
            git checkout ${{ needs.pre-deploy.outputs.version }}
            npm ci --omit=dev --production
            pm2 restart his-backend --wait-ready
            pm2 save

      - name: Production health check
        run: |
          sleep 10
          curl -f https://api.hospital.vn/health || echo "Manual health check required"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.pre-deploy.outputs.version }}
          generate_release_notes: true
          files: retire-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 HIS Backend released to *Production*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 HIS Backend — Production Release*\n• Version: `${{ needs.pre-deploy.outputs.version }}`\n• Commit: `${{ github.sha }}`\n• Actor: `${{ github.actor }}`\n• Status: `${{ job.status }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
