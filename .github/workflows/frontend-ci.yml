name: Frontend CI

on:
  push:
    branches:
      - develop/MinhDung
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
      - .github/workflows/frontend-cd-staging.yml
  pull_request:
    branches:
      - develop/MinhDung
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml
      - .github/workflows/frontend-cd-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_and_test:
    name: Lint and Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Detect frontend project directory
        id: project
        run: |
          if [ -f frontend/package.json ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Frontend package.json not found in frontend/. Skipping lint and test for bootstrap CI run."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.project.outputs.available == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        if: steps.project.outputs.available == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run lint

      - name: Run unit tests
        if: steps.project.outputs.available == 'true'
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm test -- --runInBand

      - name: CI bootstrap summary
        if: steps.project.outputs.available != 'true'
        run: echo "Frontend source not present in this branch, so CI completed as a bootstrap success."