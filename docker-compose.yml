services:
  backend:
    image: node:18-alpine
    container_name: his-backend
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-QLBV}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd123}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SOCKET_IO_CORS_ORIGIN: ${SOCKET_IO_CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - .:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - his-net

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: his-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd123}
      MSSQL_TCP_PORT: 1433
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - his-net

  redis:
    image: redis:7-alpine
    container_name: his-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - his-net

  nginx:
    image: nginx:1.27-alpine
    container_name: his-nginx
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - his-net

volumes:
  backend_node_modules:
  mssql_data:
  redis_data:

networks:
  his-net:
    driver: bridge